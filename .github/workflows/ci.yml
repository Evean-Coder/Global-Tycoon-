name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test 2>&1 | tee unit-results.txt
        shell: bash
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e 2>&1 | tee browser-results.txt
        shell: bash
      - run: npm run test:phone:webkit 2>&1 | tee webkit-results.txt
        shell: bash
      - name: Report test failures
        if: failure()
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const escape = text => text.replace(/%/g, '%25').replace(/\r/g, '%0D').replace(/\n/g, '%0A');
          for (const file of ['unit-results.txt', 'browser-results.txt', 'webkit-results.txt']) {
            if (!fs.existsSync(file)) continue;
            const log = fs.readFileSync(file, 'utf8');
            for (const match of log.matchAll(/^not ok \d[^\n]*/gm)) {
              const preceding = log.slice(Math.max(0, match.index - 2000), match.index);
              const detail = log.slice(match.index).split(/^# Subtest:/m)[0].slice(0, 6500);
              console.log('::error title=' + file + ' failure::' + escape('Preceding context:\n' + preceding + '\nFailure:\n' + detail));
            }
          }
          NODE
