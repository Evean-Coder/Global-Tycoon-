<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>移动对局布局 · 离线样例</title><link rel="stylesheet" href="../../public/style.css">
<body class="game-active compact-game"><header><div class="brand">环球大亨 · 布局样例</div><button onclick="alert('离线演示；金额、玩家和地块为布局占位，正式玩法保持原规则。')">说明</button></header>
<section id="view-game"><section id="quickClockBar" class="quick-clock-bar">快速模式 · 整局剩余 <b id="quickTimer">29:32</b><span>离线示例，不会计时</span></section>
<div id="gameMain"><div id="boardWrap"><div id="boardScale"><div id="board"></div></div></div><div id="side"><nav id="infoTabs" aria-label="示例信息"><button onclick="info('资产')">资产</button><button onclick="info('玩家')">玩家</button><button onclick="info('资讯')">资讯</button><button onclick="info('事件')">事件</button><button onclick="info('更多')">更多</button></nav><div id="infoAssetSlot"><div id="ledger"><div id="ledgerBody"><h4>我的资产 · 示例</h4><p>净资产 ￥150,000 · 现金 ￥120,000</p><p>城市 2座 · 机场 1座 · 持股 4股</p></div></div></div><div id="actionDock"></div></div></div>
<div id="actionBar"><span id="managementStatus">本回合可经营1项 · 也可直接掷骰</span><span id="turnInfo">当前回合：航海家 · 示例</span><span id="timer">决定 60s</span><button class="primary" onclick="info('掷骰：仅作演示')">掷骰子</button><button onclick="info('资产')">查看资产</button><button onclick="info('主动经营')">主动经营</button><button id="btnMore" onclick="info('更多')">更多</button></div></section>
<script src="../../public/board-layout.js"></script><script>
const names=['起点','肯尼亚·内罗毕','南非·开普敦','机会卡','摩洛哥·卡萨布兰卡','埃及·开罗','开罗国际机场','机会卡','新西兰·奥克兰','澳大利亚·悉尼','休闲','监狱'];
for(let id=0;id<42;id++){const p=BoardLayout.position(id,'compact'),el=document.createElement('button');el.className='sq t-city';el.style.gridRow=p[0];el.style.gridColumn=p[1];el.innerHTML='<span class="num">'+id+'</span><span class="nm">'+names[id%12]+'</span><span class="sq-amount">￥3.6k</span><span class="own">航海家甲 · 示例</span>';el.onclick=()=>alert('第'+id+'格：离线示例，不发送游戏动作');document.getElementById('board').append(el);}
function info(name){document.getElementById('ledgerBody').textContent=name+' · 离线布局占位；正式界面显示真实对局状态。';}
function layout(){const short=innerWidth>600&&innerHeight<=500;document.body.classList.toggle('short-game',short);(short?document.getElementById('actionDock'):document.getElementById('view-game')).append(document.getElementById('actionBar'));}addEventListener('resize',layout);layout();
</script></body></html>
